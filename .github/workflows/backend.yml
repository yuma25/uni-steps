name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  check-backend:
    name: Go Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check Format
        run: |
          if [ -n "$(go fmt ./...)" ]; then
            echo "Format check failed. Please run 'go fmt ./...' locally."
            exit 1
          fi

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Build Check
        run: go build -v ./...
